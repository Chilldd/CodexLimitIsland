[package]
name = "codexlimit"
version = "0.1.0"
description = "Codex App quota island for Windows"
authors = ["YuG"]
edition = "2021"
default-run = "codexlimit"

[lib]
name = "codexlimit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
